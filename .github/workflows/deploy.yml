
name: Deploy OpenDS Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Extract Docusaurus project
        run: |
          tar -xzf opends-docs.tar.gz
          test -f opends-docs/package.json

      - name: Install dependencies
        working-directory: opends-docs
        run: npm install

      - name: Build documentation
        working-directory: opends-docs
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: opends-docs/build

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
