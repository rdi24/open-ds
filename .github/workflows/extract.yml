name: Extract Docusaurus Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract archive
        run: |
          tar -xzf opends-docs.tar.gz --strip-components=1
          test -f package.json
          test -f docusaurus.config.js

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract Docusaurus source"
          git push
